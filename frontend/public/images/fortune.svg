<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- White Die-cut Border -->
    <path d="M100 25 C 145 25, 175 60, 175 100 C 175 135, 155 160, 130 175 L 70 175 C 45 160, 25 135, 25 100 C 25 60, 55 25, 100 25 Z" fill="white" stroke="none" />
    
    <!-- Base -->
    <path d="M70 140 L130 140 L140 160 L60 160 Z" fill="#8B4513" />
    <rect x="60" y="160" width="80" height="10" fill="#5D4037" rx="2" />
    
    <!-- Crystal Ball -->
    <circle cx="100" cy="95" r="50" fill="#E6E6FA" /> <!-- Lavender base -->
    <circle cx="100" cy="95" r="45" fill="url(#grad1)" />
    
    <!-- Shine/Reflection -->
    <ellipse cx="85" cy="75" rx="10" ry="6" fill="white" opacity="0.6" transform="rotate(-45 85 75)" />
    
    <!-- Mystical Eye inside -->
    <path d="M85 95 Q100 85 115 95 Q100 105 85 95 Z" fill="#4B0082" />
    <circle cx="100" cy="95" r="5" fill="#FFF" />
    <circle cx="100" cy="95" r="2" fill="#000" />
    
    <!-- Sparkles -->
    <text x="140" y="70" font-size="20" fill="#FFD700">✨</text>
    <text x="50" y="120" font-size="16" fill="#FFD700">✨</text>
  </g>
  <defs>
    <radialGradient id="grad1" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:rgb(255,255,255);stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:rgb(138,43,226);stop-opacity:0.6" />
    </radialGradient>
  </defs>
</svg>
