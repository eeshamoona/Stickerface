<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- White Die-cut Border -->
    <rect x="25" y="55" width="150" height="100" rx="15" fill="white" />
    
    <!-- Bus Body -->
    <rect x="35" y="65" width="130" height="80" rx="10" fill="#FFD700" /> <!-- Yellow School Bus Color -->
    
    <!-- Windows -->
    <rect x="40" y="75" width="25" height="20" fill="#87CEEB" rx="2" />
    <rect x="70" y="75" width="25" height="20" fill="#87CEEB" rx="2" />
    <rect x="100" y="75" width="25" height="20" fill="#87CEEB" rx="2" />
    <rect x="130" y="75" width="25" height="20" fill="#87CEEB" rx="2" /> <!-- Driver Window -->
    
    <!-- Stripe -->
    <rect x="35" y="105" width="130" height="10" fill="#000" />
    
    <!-- Wheels -->
    <circle cx="65" cy="145" r="12" fill="#333" />
    <circle cx="65" cy="145" r="5" fill="#AAA" />
    
    <circle cx="135" cy="145" r="12" fill="#333" />
    <circle cx="135" cy="145" r="5" fill="#AAA" />
    
    <!-- Headlights -->
    <circle cx="160" cy="125" r="4" fill="#FFF" />
    <circle cx="160" cy="125" r="2" fill="#FFD700" />
    
    <!-- Bumper -->
    <rect x="30" y="135" width="5" height="20" fill="#AAA" rx="2" />
    <rect x="165" y="135" width="5" height="20" fill="#AAA" rx="2" />
  </g>
</svg>
