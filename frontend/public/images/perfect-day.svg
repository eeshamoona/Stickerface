<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- White Die-cut Border -->
    <path d="M100 20 C 150 20, 180 50, 180 100 C 180 160, 150 185, 100 185 C 50 185, 20 160, 20 100 C 20 50, 50 20, 100 20 Z" fill="white" stroke="none" />
    
    <!-- Bear Face -->
    <circle cx="100" cy="100" r="60" fill="#D2B48C" /> <!-- Light Brown Face -->
    <circle cx="75" cy="80" r="20" fill="#D2B48C" />  <!-- Left Ear Base -->
    <circle cx="125" cy="80" r="20" fill="#D2B48C" /> <!-- Right Ear Base -->
    <circle cx="75" cy="80" r="10" fill="#8B4513" />  <!-- Left Ear Inner -->
    <circle cx="125" cy="80" r="10" fill="#8B4513" /> <!-- Right Ear Inner -->
    
    <!-- Eyes -->
    <circle cx="85" cy="95" r="6" fill="#000" />
    <circle cx="115" cy="95" r="6" fill="#000" />
    
    <!-- Snout -->
    <ellipse cx="100" cy="115" rx="20" ry="14" fill="#FFE4C4" />
    <circle cx="100" cy="110" r="6" fill="#000" /> <!-- Nose -->
    <path d="M100 116 L100 122 M95 125 Q100 128 105 125" stroke="#000" stroke-width="2" fill="none" /> <!-- Mouth -->
    
    <!-- Blush -->
    <circle cx="75" cy="110" r="6" fill="#FFB6C1" opacity="0.6" />
    <circle cx="125" cy="110" r="6" fill="#FFB6C1" opacity="0.6" />
  </g>
</svg>
